<!-- Animación Album --> 
<script> const images = ["A.jpg", "B.JPG",];
  let current = 0; function showImage(index) {
    current = index; document.getElementById("mainImage").src = images[index];
    // Actualiza miniaturas activas
    document.querySelectorAll(".thumbnails img").forEach((thumb, i) => {
      thumb.classList.toggle("active", i === index);});}
 // Cambio automático cada 5 segundos
  setInterval(() => {current = (current + 1) % images.length;
    showImage(current);}, 5000);</script>
